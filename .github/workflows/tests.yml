name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # deliberately not installing torch/ultralytics: the tests that need an
      # exported ONNX model skip themselves, and CI stays under a minute.
      - run: pip install numpy onnxruntime opencv-python-headless pytest
      - run: python -m pytest tests -q
